name: Manual Java Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'The version to release (e.g., 1.2.0)'
        required: true
        type: string
      next_snapshot:
        description: 'The next development snapshot version (e.g., 1.3.0-SNAPSHOT)'
        required: true
        type: string

permissions:
  contents: write # Required to push tags and update pom.xml back to the repository

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"

      - name: Run Maven Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn --batch-mode release:prepare release:perform \
            -DreleaseVersion=${{ inputs.release_version }} \
            -DdevelopmentVersion=${{ inputs.next_snapshot }}
